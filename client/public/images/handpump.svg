<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#sky)"/>
  
  <!-- Sun & Village Trees in background -->
  <circle cx="680" cy="100" r="50" fill="#fef08a" opacity="0.8"/>
  <path d="M0,280 Q100,240 200,275 Q350,230 500,270 Q650,240 800,280 L800,300 L0,300 Z" fill="#15803d" opacity="0.4"/>
  <path d="M0,290 Q150,260 300,285 Q500,255 700,285 L800,295 L800,300 L0,300 Z" fill="#166534" opacity="0.7"/>

  <!-- Ground -->
  <rect y="300" width="800" height="150" fill="url(#ground)"/>
  <ellipse cx="400" cy="400" rx="360" ry="40" fill="#92400e" opacity="0.5"/>

  <!-- Concrete Platform Base -->
  <polygon points="220,380 580,380 640,415 160,415" fill="url(#concrete)"/>
  <polygon points="160,415 640,415 640,425 160,425" fill="#475569"/>
  <!-- Platform crack -->
  <path d="M350,385 L370,400 L365,415" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M480,390 L495,405 L510,415" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Hand Pump Base Pedestal -->
  <rect x="360" y="280" width="80" height="100" rx="6" fill="url(#metal)"/>
  <rect x="350" y="370" width="100" height="12" rx="3" fill="#334155"/>
  <rect x="355" y="275" width="90" height="10" rx="2" fill="#334155"/>

  <!-- Pump Body Cylinder -->
  <rect x="375" y="160" width="50" height="120" rx="4" fill="url(#metal)"/>
  <rect x="370" y="150" width="60" height="14" rx="3" fill="#334155"/>

  <!-- Rust Patches on Cylinder -->
  <path d="M380,180 Q395,190 390,210 Q380,225 385,240 L378,240 Z" fill="url(#rust)" opacity="0.85"/>
  <path d="M410,230 Q420,245 415,265 L422,265 Z" fill="url(#rust)" opacity="0.9"/>

  <!-- Water Spout -->
  <path d="M375,220 L300,240 L300,265 L320,265 L320,250 L375,235 Z" fill="url(#metal)"/>
  <ellipse cx="310" cy="265" rx="10" ry="4" fill="#1e293b"/>
  <!-- Dry Drip Mark -->
  <ellipse cx="310" cy="385" rx="18" ry="6" fill="#78350f" opacity="0.6"/>

  <!-- Pump Head Cap -->
  <path d="M365,150 L435,150 L425,120 L375,120 Z" fill="url(#metal)"/>

  <!-- Pump Handle Mechanism -->
  <circle cx="410" cy="135" r="8" fill="#1e293b"/>
  <!-- Broken/Detached Handle arm hanging loose -->
  <line x1="410" y1="135" x2="570" y2="220" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
  <line x1="570" y1="220" x2="620" y2="290" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
  <!-- Handle Counterweight -->
  <circle cx="620" cy="290" r="18" fill="url(#metal)"/>

  <!-- Defect Callout / Warning Overlay Badge -->
  <rect x="20" y="20" width="220" height="42" rx="10" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="42" cy="41" r="10" fill="#ef4444"/>
  <text x="42" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">!</text>
  <text x="62" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">DEFECTIVE PUMP</text>
  <text x="62" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Kanke Village • Water Supply Off</text>
</svg>
