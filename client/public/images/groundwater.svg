<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="labBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="turbidWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a16207" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#713f12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#labBg)"/>

  <!-- Lab bench grid lines -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#475569" stroke-width="6"/>
  <rect y="363" width="800" height="87" fill="#0f172a"/>

  <!-- Industrial Facility Backdrop Silhouette -->
  <polygon points="40,260 80,220 120,260 120,360 40,360" fill="#1e293b"/>
  <polygon points="140,240 200,200 260,240 260,360 140,360" fill="#1e293b"/>
  <rect x="180" y="150" width="16" height="50" fill="#1e293b"/>
  <rect x="220" y="130" width="20" height="70" fill="#1e293b"/>

  <!-- Large Glass Flask (Beaker/Erlenmeyer) -->
  <polygon points="340,140 460,140 540,340 260,340" fill="url(#glass)" stroke="#94a3b8" stroke-width="4"/>
  <rect x="330" y="125" width="140" height="15" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>

  <!-- Turbid Sample Liquid Inside Flask -->
  <polygon points="275,335 525,335 480,220 320,220" fill="url(#turbidWater)"/>
  
  <!-- Particulate Residue / Bubbles -->
  <circle cx="360" cy="280" r="6" fill="#451a03"/>
  <circle cx="430" cy="300" r="8" fill="#451a03"/>
  <circle cx="400" cy="250" r="5" fill="#ca8a04"/>
  <circle cx="470" cy="270" r="7" fill="#713f12"/>
  <circle cx="330" cy="310" r="9" fill="#451a03"/>

  <!-- Sensor Probe / Test Electrode immersed in liquid -->
  <rect x="395" y="60" width="10" height="200" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <circle cx="400" cy="260" r="7" fill="#ef4444"/>

  <!-- Sensor Digital Reading Display -->
  <rect x="520" y="160" width="180" height="90" rx="10" fill="#020617" stroke="#334155" stroke-width="3"/>
  <text x="535" y="190" font-family="monospace" font-size="13" font-weight="bold" fill="#f87171">TURBIDITY: HIGH</text>
  <text x="535" y="212" font-family="monospace" font-size="16" font-weight="bold" fill="#ef4444">48.5 NTU</text>
  <text x="535" y="235" font-family="monospace" font-size="11" fill="#f59e0b">SULFUR DETECTED</text>

  <!-- Defect Callout / Warning Overlay Badge -->
  <rect x="20" y="20" width="260" height="42" rx="10" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="42" cy="41" r="10" fill="#ef4444"/>
  <text x="42" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">!</text>
  <text x="62" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">GROUNDWATER HAZARD</text>
  <text x="62" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Tatisilwai Industrial Zone • 400 Families</text>
</svg>
