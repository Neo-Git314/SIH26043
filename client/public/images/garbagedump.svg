<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="skyCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dumpster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" fill="url(#skyCity)"/>
  
  <!-- Urban buildings backdrop -->
  <rect x="50" y="100" width="120" height="220" fill="#64748b" opacity="0.6"/>
  <rect x="190" y="70" width="160" height="250" fill="#475569" opacity="0.7"/>
  <rect x="370" y="120" width="140" height="200" fill="#64748b" opacity="0.5"/>
  <rect x="530" y="80" width="180" height="240" fill="#334155" opacity="0.65"/>

  <!-- Asphalt Road & Sidewalk -->
  <rect y="320" width="800" height="130" fill="#334155"/>
  <polygon points="0,320 800,320 800,350 0,350" fill="#94a3b8"/>

  <!-- Municipal Dumpster -->
  <polygon points="260,240 540,240 570,360 230,360" fill="url(#dumpster)" stroke="#064e3b" stroke-width="4"/>
  <rect x="250" y="230" width="300" height="16" rx="4" fill="#065f46"/>
  <line x1="280" y1="260" x2="295" y2="340" stroke="#064e3b" stroke-width="4"/>
  <line x1="400" y1="260" x2="400" y2="340" stroke="#064e3b" stroke-width="4"/>
  <line x1="520" y1="260" x2="505" y2="340" stroke="#064e3b" stroke-width="4"/>

  <!-- Overflowing garbage piles -->
  <ellipse cx="400" cy="220" rx="140" ry="35" fill="#ca8a04"/>
  <ellipse cx="360" cy="205" rx="70" ry="25" fill="#eab308"/>
  <ellipse cx="440" cy="200" rx="60" ry="22" fill="#d97706"/>
  
  <!-- Ground spillage -->
  <ellipse cx="230" cy="370" rx="80" ry="20" fill="#854d0e" opacity="0.9"/>
  <ellipse cx="560" cy="375" rx="90" ry="22" fill="#713f12" opacity="0.9"/>
  <circle cx="210" cy="365" r="14" fill="#3b82f6" opacity="0.8"/>
  <rect x="540" y="360" width="28" height="18" rx="2" fill="#ef4444" opacity="0.85"/>
  <polygon points="570,355 590,370 560,375" fill="#10b981"/>

  <!-- Defect Callout / Warning Overlay Badge -->
  <rect x="20" y="20" width="240" height="42" rx="10" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="42" cy="41" r="10" fill="#ef4444"/>
  <text x="42" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">!</text>
  <text x="62" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">MUNICIPAL OVERFLOW</text>
  <text x="62" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Lalpur Market • Waste Collection Halt</text>
</svg>
