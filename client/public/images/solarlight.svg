<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="poleMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="solarPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="batteryBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Night Sky Backdrop -->
  <rect width="800" height="450" fill="url(#nightSky)"/>
  
  <!-- Stars in background -->
  <circle cx="80" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="220" cy="90" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="340" cy="40" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="620" cy="70" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="710" cy="120" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="750" cy="45" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Distant Village Houses Silhouette -->
  <polygon points="60,350 120,300 180,350 180,410 60,410" fill="#020617"/>
  <polygon points="200,360 250,320 300,360 300,410 200,410" fill="#020617"/>
  <polygon points="560,340 620,290 680,340 680,410 560,410" fill="#020617"/>

  <!-- Road & Footpath -->
  <polygon points="0,410 800,410 800,450 0,450" fill="#1e293b"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#475569" stroke-width="4"/>
  <!-- Road dashes -->
  <line x1="50" y1="430" x2="150" y2="430" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="20 20"/>
  <line x1="250" y1="430" x2="400" y2="430" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="20 20"/>
  <line x1="500" y1="430" x2="650" y2="430" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="20 20"/>

  <!-- Steel Pole Structure -->
  <rect x="420" y="70" width="16" height="340" fill="url(#poleMetal)"/>
  <polygon points="410,400 446,400 454,410 402,410" fill="#334155"/>

  <!-- Angled Solar Panel Bracket -->
  <line x1="428" y1="80" x2="350" y2="40" stroke="url(#poleMetal)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Solar PV Panel Surface -->
  <polygon points="300,55 450,20 440,5 290,40" fill="url(#solarPanel)" stroke="#60a5fa" stroke-width="2"/>
  <!-- Solar Grid Lines -->
  <line x1="337" y1="46" x2="330" y2="30" stroke="#93c5fd" stroke-width="1"/>
  <line x1="375" y1="37" x2="368" y2="21" stroke="#93c5fd" stroke-width="1"/>
  <line x1="412" y1="28" x2="405" y2="12" stroke="#93c5fd" stroke-width="1"/>

  <!-- Street Lamp Arm Extending Right -->
  <path d="M428,95 Q490,95 530,130" stroke="url(#poleMetal)" stroke-width="8" fill="none"/>
  
  <!-- LED Luminaire Fixture -->
  <polygon points="510,130 550,130 560,145 500,145" fill="#334155"/>
  <rect x="508" y="145" width="44" height="6" rx="2" fill="#475569"/>
  <!-- Broken LED fixture indicator (Dark / Red X) -->
  <ellipse cx="530" cy="155" rx="15" ry="4" fill="#0f172a"/>
  <!-- Warning indicator of failure -->
  <circle cx="530" cy="148" r="12" fill="#ef4444" opacity="0.9"/>
  <text x="530" y="153" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">✕</text>

  <!-- Battery Enclosure Box mounted on pole -->
  <rect x="408" y="210" width="40" height="50" rx="4" fill="url(#batteryBox)" stroke="#78350f" stroke-width="2"/>
  <circle cx="428" cy="225" r="4" fill="#ef4444"/>
  <rect x="420" y="238" width="16" height="8" rx="2" fill="#1e293b"/>
  <text x="428" y="244" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="#f87171" text-anchor="middle">OFF</text>

  <!-- Defect Callout / Warning Overlay Badge -->
  <rect x="20" y="20" width="240" height="42" rx="10" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="42" cy="41" r="10" fill="#f59e0b"/>
  <text x="42" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">⚡</text>
  <text x="62" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">SOLAR LAMP FAULT</text>
  <text x="62" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Namkum Block • Battery Inverter Failure</text>
</svg>
